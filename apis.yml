name: Behance
description: Behance is Adobe's online creative networking and portfolio platform where designers,
  illustrators, photographers, and other creatives showcase, discover, and follow creative work through
  project-based portfolios. Founded in 2005 by Matias Corea and Scott Belsky, it was acquired by Adobe in
  2012 for roughly $150 million and is now tightly integrated with Adobe Creative Cloud and Adobe Portfolio.
  Behance passed 24 million members by 2020. Adobe has since retired the former public Behance REST API, so
  the platform no longer exposes a documented public developer program; this profile is maintained in the API
  Evangelist network as a company/provider record.
